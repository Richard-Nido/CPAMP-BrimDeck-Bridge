name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core and SQLite tests
        shell: pwsh
        run: dotnet run --project tests/Bridge.Tests/Bridge.Tests.csproj -- "$PWD" (Get-Command python).Source
      - name: JavaScript contracts
        run: |
          node tests/scripts.test.mjs
          node tests/direct-scripts.test.mjs
      - name: Publish self-contained executable
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CPAMP-BrimDeck-Bridge-win-x64
          path: dist/
          if-no-files-found: error
